name: Build Dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-riscv64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build RISC-V binary
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=riscv64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o dist/hawser-linux-riscv64 ./cmd/hawser

      - name: Upload
        uses: marvinpinto/action-automatic-releases@master
        with:
          title: "${{ github.event.repository.name }}"
          automatic_release_tag: "latest"
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          files: |
            dist/hawser-linux-riscv64
